name: Build and deploy

# Every push to main is validated, tested and (only if everything passes) published to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Import images"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install tools (pinned versions)
        run: |
          pip install pyyaml==6.0.3
          npm install --no-audit --no-fund
      - name: Validate data and run unit tests
        run: npm test
      - name: Build site
        run: npm run build
      - name: Browser tests (iPhone and laptop sizes)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Data report
        if: always()
        run: cat build/data/report.txt >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
