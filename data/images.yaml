# Images used on the cards. The "Import images" workflow fetches each one, checks its licence
# and records author/licence in images/commons-meta.json.
#   from_article: use the lead image of that Wikipedia article ("en:Title")
#   file:         use this exact Wikimedia Commons file name instead
#   alt:          text for screen readers
#   masks:        rectangles hiding labels on the question side, in % of width/height (x, y, w, h)
#   mask_always:  true = keep the masks on the answer side too (used for English labels; the app is Latin-only)

img.deltoideus: {from_article: "en:Deltoid muscle", alt: "Front view of the trunk with Musculus deltoideus highlighted on both sides", mask_always: true, masks: [{x: 6, y: 35, w: 18, h: 6}]}
